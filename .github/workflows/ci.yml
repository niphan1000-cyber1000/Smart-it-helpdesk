name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun (matches bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run lint

      - name: Lint Firestore security rules
        run: bun run lint:rules

      - name: Run automated security and RBAC tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Run Firestore Emulator Security Tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-it-helpdesk "bun run test"
