name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun (matches bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run lint

      - name: Lint Firestore security rules
        run: bun run lint:rules

      - name: Run automated security, RBAC, and real Redis tests
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Run Firestore Emulator Security Tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-it-helpdesk "bun run test"
